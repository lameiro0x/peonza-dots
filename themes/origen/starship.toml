# GENERATED by theme/render.py — theme «Origen». Edit theme/templates/@origen/starship.toml or contracts/themes/origen.json and re-run it.
# starship 1.27, theme «Origen»: gruvbox capsules on a ruled line. Each segment is
# a rounded pill in one of the theme's hues with ink letters, the frame and its rule
# in gruvbox's grey; below, the peonza in the theme's orange (the frame, the
# peonza's three cells and the transient line: see theme/templates/starship.toml):
#
#   ╭─ ( ~/Repos/ryce-pc ) ( main ) ( ~1 +2 ) ( 12s ) ( x 1 ) ─────── <clock> 14:32
#   ╰─ <peonza>  _

format = """[╭─ ](rule)$hostname$directory$git_branch$git_status$cmd_duration$status $fill $time
[╰─ ](rule)$character"""
palette = "ryce"

[palettes.ryce]
rule = "#ae9f90"
ink = "#1d2021"
muted = "#bdae93"
dir = "#fabd2f"
branch = "#8ec07c"
changes = "#d3869b"
took = "#d5c4a1"
peonza = "#fabd2f"
err = "#f25c54"

[hostname]
style = "muted"
format = "[$hostname]($style) "  # ssh only

[directory]
read_only = " 󰍁"
format = "[](fg:dir)[󰉋 $path$read_only](bold fg:ink bg:dir)[](fg:dir)"
truncation_length = 3
truncate_to_repo = true
truncation_symbol = "…/"

[git_branch]
symbol = "󰘬 "
format = " [](fg:branch)[$symbol$branch](fg:ink bg:branch)[](fg:branch)"

[git_status]
# Each count leads with its own space, so two never touch (~1 +2 ?3 ⇡4).
format = "( [](fg:changes)[$all_status$ahead_behind ](fg:ink bg:changes)[](fg:changes))"
ahead = " ⇡${count}"
behind = " ⇣${count}"
diverged = " ⇕"
modified = " ~${count}"
staged = " +${count}"
untracked = " ?${count}"
deleted = " -${count}"
renamed = " »${count}"
stashed = ""
conflicted = " !${count}"

[cmd_duration]
min_time = 2000
format = " [](fg:took)[󰔛 $duration](fg:ink bg:took)[](fg:took)"

[status]
disabled = false
format = " [](fg:err)[󰅖 $status](bold fg:ink bg:err)[](fg:err)"

[fill]
symbol = "─"
style = "rule"

[time]
disabled = false
time_format = "%H:%M"
format = "[󰅐 $time](muted)"

[character]
success_symbol = "[􀀃  ](peonza)"
error_symbol = "[􀀃  ](err)"
vimcmd_symbol = "[􀀃  ](branch)"
