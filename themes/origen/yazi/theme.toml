# GENERATED by theme/render.py — theme «Origen». Edit theme/templates/yazi/theme.toml or contracts/themes/origen.json and re-run it.
# yazi 26.9 theme, «Origen». Merged over yazi's dark preset: only what the
# preset paints blue (directories, mode and tab pills, every popup border) changes.
# Named colours are ANSI slots, so kitty's palette swap recolours a running yazi;
# hex values are the theme's grounds. Directories match ls: bold, gold slot.

[mgr]
cwd          = { fg = "cyan" }
border_style = { fg = "#504945" }

[tabs]
active   = { fg = "#1d2021", bg = "yellow", bold = true }
inactive = { fg = "yellow", bg = "#3c3836" }

[mode]
normal_main = { fg = "#1d2021", bg = "yellow", bold = true }
normal_alt  = { fg = "yellow", bg = "#3c3836" }
select_main = { fg = "#1d2021", bg = "magenta", bold = true }
select_alt  = { fg = "magenta", bg = "#3c3836" }
unset_main  = { fg = "#1d2021", bg = "red", bold = true }
unset_alt   = { fg = "red", bg = "#3c3836" }

[status]
perm_sep   = { fg = "darkgray" }
perm_type  = { fg = "yellow" }
perm_read  = { fg = "green" }
perm_write = { fg = "red" }
perm_exec  = { fg = "cyan" }

[which]
border = { fg = "#504945" }
cand   = { fg = "cyan" }
desc   = { fg = "magenta" }

[confirm]
border = { fg = "#504945" }
title  = { fg = "yellow" }

[spot]
border  = { fg = "#504945" }
title   = { fg = "yellow" }
tbl_col = { fg = "yellow" }

[pick]
border = { fg = "#504945" }

[input]
border = { fg = "#504945" }

[cmp]
border = { fg = "#504945" }

[tasks]
border = { fg = "#504945" }

[help]
border = { fg = "#504945" }

# The same families as LS_COLORS in fish/colors.fish.
[filetype]
rules = [
	{ mime = "**/image/*", fg = "magenta" },
	{ mime = "**/{audio,video}/*", fg = "lightmagenta" },
	{ mime = "**/application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "red" },
	{ mime = "**/application/{pdf,doc,rtf}", fg = "lightyellow" },
	{ mime = "vfs/{absent,stale}", fg = "darkgray" },
	{ url = "*", is = "orphan", fg = "red", bold = true },
	{ url = "*", is = "link", fg = "cyan" },
	{ url = "*", is = "exec", fg = "green", bold = true },
	{ url = "*", is = "dummy", bg = "red" },
	{ url = "*/", is = "dummy", bg = "red" },
	{ url = "*/", fg = "yellow", bold = true },
]

[icon]
prepend_conds = [
	{ if = "dir", text = "󰉋", fg = "#d79921" },
	{ if = "exec & !link", text = "󰞷", fg = "#a7a628" },
]
