# GENERATED by theme/render.py — theme «Ola». Edit theme/templates/@ola/starship.toml or contracts/themes/ola.json and re-run it.
# starship 1.27, theme «Ola»: kanagawa swells on a ruled line. Each segment is a
# slanted band in one of the theme's hues, leaning forward like the crest in
# Hokusai's print, the directory signed with a wave; the frame and its rule in the
# theme's grey, the peonza in foam (the frame, the peonza's three cells and the
# transient line: see theme/templates/starship.toml):
#
#   ╭─ ◢ ~ ~/Repos/ryce-pc ◤ ◢ main ◤ ◢ ~1 +2 ◤ ◢ 12s ◤ ──────────────── 14:32
#   ╰─ <peonza>  _

format = """[╭─ ](rule)$hostname$directory$git_branch$git_status$cmd_duration$status $fill $time
[╰─ ](rule)$character"""
palette = "ryce"

[palettes.ryce]
rule = "#a19f93"
ink = "#16161d"
muted = "#c8c093"
foam = "#a3d4d5"
violet = "#aa95ca"
carp = "#e6c384"
sand = "#c0a36e"
peonza = "#a3d4d5"
err = "#ff5d62"

[hostname]
style = "muted"
format = "[$hostname]($style) "  # ssh only

[directory]
read_only = " 󰍁"
format = "[](fg:foam)[󰞍 $path$read_only](bold fg:ink bg:foam)[](fg:foam)"
truncation_length = 3
truncate_to_repo = true
truncation_symbol = "…/"

[git_branch]
symbol = "󰘬 "
format = " [](fg:violet)[$symbol$branch](fg:ink bg:violet)[](fg:violet)"

[git_status]
# Each count leads with its own space, so two never touch (~1 +2 ?3 ⇡4).
format = "( [](fg:carp)[$all_status$ahead_behind ](fg:ink bg:carp)[](fg:carp))"
ahead = " ⇡${count}"
behind = " ⇣${count}"
diverged = " ⇕"
modified = " ~${count}"
staged = " +${count}"
untracked = " ?${count}"
deleted = " -${count}"
renamed = " »${count}"
stashed = ""
conflicted = " !${count}"

[cmd_duration]
min_time = 2000
format = " [](fg:sand)[󰔛 $duration](fg:ink bg:sand)[](fg:sand)"

[status]
disabled = false
format = " [](fg:err)[󰅖 $status](bold fg:ink bg:err)[](fg:err)"

[fill]
symbol = "─"
style = "rule"

[time]
disabled = false
time_format = "%H:%M"
format = "[$time](muted)"

[character]
success_symbol = "[􀀃  ](peonza)"
error_symbol = "[􀀃  ](err)"
vimcmd_symbol = "[􀀃  ](violet)"
