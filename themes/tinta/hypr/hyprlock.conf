# GENERATED by theme/render.py — theme «Tinta». Edit theme/templates/@tinta/hypr/hyprlock.conf or contracts/themes/tinta.json and re-run it.
# hyprlock 0.9.7 · Tinta: the layout of the lock in r/unixporn post 1tg82cr (credited in the
# README). The peonza's half-section blurred to grey, the time large in the terminal face with the
# date under it, a round portrait (here the peonza) over the name, a small
# field with its arrow, the music under it, and two framed buttons. One
# centred column, measured off the post at 1920x1080.
#
# Every colour and font is a theme token; the theme's signal colour is used
# for exactly one line: how many AI sessions wait for you (agentd writes the
# count to lock.txt). Checked against hyprlock 0.9.7 itself.

general {
    # The cursor stays: the music and power buttons take clicks.
    hide_cursor = false
    ignore_empty_input = true
}

animations {
    enabled = true
    bezier = crisp, 0.2, 0, 0, 1
    animation = fadeIn, 1, 3, crisp
    animation = fadeOut, 1, 2, crisp
    animation = inputFieldDots, 1, 2, crisp
    animation = inputFieldColors, 1, 3, crisp
}

# The eye, blurred until only its shapes remain (as in the post), then sunk
# so the grey text clears 4.5:1 on its brightest part (measured on the stage's
# captures; no full-screen shape: hyprlock would draw it over the labels).
background {
    monitor =
    path = ~/.local/state/ryce/theme/current/wallpaper/lock.jpg
    color = rgb(0a0a0a)
    blur_passes = 3
    blur_size = 7
    brightness = 0.48
    contrast = 0.9
    vibrancy = 0
    noise = 0.015
}


# --- time ---------------------------------------------------------------------

label {
    monitor =
    text = cmd[update:5000] date '+%H:%M'
    color = rgb(f0f0f0)
    font_size = 56
    font_family = JetBrainsMono Nerd Font
    position = 0, -150
    halign = center
    valign = top
}

# «domingo, 17 de mayo de 2026», named here: without a generated es_ES locale
# `date` mixes English into it.
label {
    monitor =
    text = cmd[update:60000] date '+%u %-d %-m %Y' | awk '{ split("lunes martes miércoles jueves viernes sábado domingo", d, " "); split("enero febrero marzo abril mayo junio julio agosto septiembre octubre noviembre diciembre", m, " "); print d[$1] ", " $2 " de " m[$3] " de " $4 }'
    color = rgb(f0f0f0)
    font_size = 15
    font_family = JetBrainsMono Nerd Font
    position = 0, -258
    halign = center
    valign = top
}

# "N agentes te esperan", or nothing (never a project name: a locked screen is
# read by passers-by).
label {
    monitor =
    text = cmd[update:2000] cat "$XDG_RUNTIME_DIR/agentd/lock.txt" 2>/dev/null
    color = rgb(ffb000)
    font_size = 12
    font_family = JetBrainsMono Nerd Font
    position = 0, -300
    halign = center
    valign = top
}

# --- who ----------------------------------------------------------------------

# The portrait: a smoked disc with a thin ring, the peonza inside at 128 px
# (an exact half of its cut-out: a clean edge, and no box of its own).
shape {
    monitor =
    size = 136, 136
    rounding = -1
    color = rgba(17, 17, 17, 0.6)
    border_size = 2
    border_color = rgba(240, 240, 240, 0.75)
    position = 0, 76
    halign = center
    valign = center
}

image {
    monitor =
    path = ~/.local/state/ryce/theme/current/peonza/logo.png
    size = 128
    rounding = 0
    border_size = 0
    zindex = 1
    position = 0, 76
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] h=$(date +%-H); if [ "$h" -ge 6 ] && [ "$h" -lt 14 ]; then g='Buenos días'; elif [ "$h" -ge 14 ] && [ "$h" -lt 21 ]; then g='Buenas tardes'; else g='Buenas noches'; fi; printf '%s, %s' "$g" "$USER"
    color = rgb(f0f0f0)
    font_size = 13
    font_family = JetBrainsMono Nerd Font
    position = 0, -22
    halign = center
    valign = center
}

# --- the field and its arrow (Enter is the arrow; the field says the map) ----

input-field {
    monitor =
    size = 220, 30
    outline_thickness = 1
    rounding = 2
    outer_color = rgba(180, 180, 180, 0.8)
    inner_color = rgba(10, 10, 10, 0.88)
    font_color = rgb(f0f0f0)
    font_family = JetBrainsMono Nerd Font
    placeholder_text = <span foreground="##b4b4b4">Contraseña · $LAYOUT[US,ES]</span>
    check_color = rgb(f0f0f0)
    fail_color = rgb(d4a9a9)
    capslock_color = rgb(e0dac6)
    fail_text = <span foreground="##d4a9a9">$FAIL ($ATTEMPTS)</span>
    dots_size = 0.22
    dots_spacing = 0.3
    dots_rounding = -1
    fade_on_empty = false
    position = -16, -70
    halign = center
    valign = center
}

shape {
    monitor =
    size = 30, 30
    rounding = 2
    color = rgba(10, 10, 10, 0.88)
    border_size = 1
    border_color = rgba(180, 180, 180, 0.8)
    position = 113, -70
    halign = center
    valign = center
}

label {
    monitor =
    text = →
    color = rgb(f0f0f0)
    font_size = 13
    font_family = JetBrainsMono Nerd Font
    zindex = 1
    position = 113, -70
    halign = center
    valign = center
}

# --- music: title over artist under the field, left-aligned to it (the face is
# monospaced: padding to a fixed width pins the left edge), pause on the right.

label {
    monitor =
    # Escaped for Pango: any web page can set a track title (security review 2026-11-09).
    text = cmd[update:2000] playerctl metadata title 2>/dev/null | awk '{ s = substr($0, 1, 24); while (length(s) < 24) s = s "\302\240"; print s }' | sed 's/\&/\&amp;/g; s/</\&lt;/g; s/>/\&gt;/g'
    color = rgb(f0f0f0)
    font_size = 11
    font_family = JetBrainsMono Nerd Font
    position = -19, -108
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:2000] playerctl metadata artist 2>/dev/null | awk '{ s = substr($0, 1, 29); while (length(s) < 29) s = s "\302\240"; print s }' | sed 's/\&/\&amp;/g; s/</\&lt;/g; s/>/\&gt;/g'
    color = rgb(b4b4b4)
    font_size = 9
    font_family = JetBrainsMono Nerd Font
    position = -26, -127
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] case $(playerctl status 2>/dev/null) in Playing) printf '󰏤' ;; Paused) printf '󰐊' ;; esac
    onclick = playerctl play-pause
    color = rgb(f0f0f0)
    font_size = 16
    font_family = JetBrainsMono Nerd Font Propo
    zindex = 1
    position = 113, -116
    halign = center
    valign = center
}

# --- two framed buttons, sleep there and power off here (the post has circles; ryce keeps corners sharp)
# Sleep is hibernate: S3 suspend kills this board's chipset on wake
# (install/power-setup.sh).

shape {
    monitor =
    size = 40, 40
    rounding = 2
    color = rgba(10, 10, 10, 0.2)
    border_size = 2
    border_color = rgba(240, 240, 240, 0.8)
    onclick = systemctl hibernate
    position = -48, -206
    halign = center
    valign = center
}

label {
    monitor =
    text = 󰤄
    onclick = systemctl hibernate
    color = rgb(f0f0f0)
    font_size = 15
    font_family = JetBrainsMono Nerd Font Propo
    zindex = 1
    position = -48, -206
    halign = center
    valign = center
}

label {
    monitor =
    text = Hibernar
    onclick = systemctl hibernate
    color = rgb(f0f0f0)
    font_size = 10
    font_family = JetBrainsMono Nerd Font
    position = -48, -244
    halign = center
    valign = center
}

shape {
    monitor =
    size = 40, 40
    rounding = 2
    color = rgba(10, 10, 10, 0.2)
    border_size = 2
    border_color = rgba(240, 240, 240, 0.8)
    onclick = systemctl poweroff
    position = 48, -206
    halign = center
    valign = center
}

label {
    monitor =
    text = 󰐥
    onclick = systemctl poweroff
    color = rgb(f0f0f0)
    font_size = 15
    font_family = JetBrainsMono Nerd Font Propo
    zindex = 1
    position = 48, -206
    halign = center
    valign = center
}

label {
    monitor =
    text = Apagar
    onclick = systemctl poweroff
    color = rgb(f0f0f0)
    font_size = 10
    font_family = JetBrainsMono Nerd Font
    position = 48, -244
    halign = center
    valign = center
}

# --- one system line at the foot -----------------------------------------------

label {
    monitor =
    text = cmd[update:60000] awk -v host="$(cat /etc/hostname 2>/dev/null)" '{ s = int($1); d = int(s / 86400); h = int(s % 86400 / 3600); m = int(s % 3600 / 60); t = (d ? d " d " : "") ((d || h) ? h " h " : "") m " min"; print host " · encendido " t }' /proc/uptime
    color = rgb(b4b4b4)
    font_size = 10
    font_family = JetBrainsMono Nerd Font
    position = 0, 36
    halign = center
    valign = bottom
}
