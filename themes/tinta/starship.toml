# GENERATED by theme/render.py — theme «Tinta». Edit theme/templates/@tinta/starship.toml or contracts/themes/tinta.json and re-run it.
# starship 1.27, theme «Tinta»: a monochrome HUD. Bracketed readings on a ruled
# line, hairlines in fg2, letters white; the only tint is err (the frame, the
# peonza's three cells and the transient line: see theme/templates/starship.toml):
#
#   ┌─[ ~/Repos/ryce-pc ]─[ main ]─[ ~1 ]─[ 12s ]────────────────────[ 14:32 ]
#   └─ <peonza>  _

format = """[┌─](mark)$hostname$directory$git_branch$git_status$cmd_duration$status$fill$time
[└─ ](mark)$character"""
palette = "ryce"

[palettes.ryce]
text = "#f0f0f0"
muted = "#b4b4b4"
mark = "#9a9a9a"
peonza = "#f0f0f0"
err = "#d4a9a9"

[hostname]
style = "muted"
format = '[\[ ](mark)[$hostname]($style)[ \]─](mark)'  # ssh only

[directory]
read_only = " 󰍁"
format = '[\[ ](mark)[$path$read_only](bold text)[ \]](mark)'
truncation_length = 3
truncate_to_repo = true
truncation_symbol = "…/"

[git_branch]
symbol = "󰘬 "
format = '[─\[ ](mark)[$symbol$branch](muted)[ \]](mark)'

[git_status]
# Each count leads with its own space, so two never touch (~1 +2 ?3 ⇡4).
format = '([─\[](mark)[$all_status$ahead_behind](text)[ \]](mark))'
ahead = " ⇡${count}"
behind = " ⇣${count}"
diverged = " ⇕"
modified = " ~${count}"
staged = " +${count}"
untracked = " ?${count}"
deleted = " -${count}"
renamed = " »${count}"
stashed = ""
conflicted = "[ !${count}](err)"

[cmd_duration]
min_time = 2000
format = '[─\[ ](mark)[$duration](muted)[ \]](mark)'

[status]
disabled = false
format = '[─\[ ](mark)[󰅖 $status](bold err)[ \]](mark)'

[fill]
symbol = "─"
style = "mark"

[time]
disabled = false
time_format = "%H:%M"
format = '[\[ ](mark)[$time](muted)[ \]](mark)'

[character]
success_symbol = "[􀀃  ](peonza)"
error_symbol = "[􀀃  ](err)"
vimcmd_symbol = "[􀀃  ](muted)"
