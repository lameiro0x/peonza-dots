# GENERATED by theme/render.py — theme «Grafito». Edit theme/templates/yazi/theme.toml or contracts/themes/grafito.json and re-run it.
# yazi 26.9 theme, «Grafito». Merged over yazi's dark preset: only what the
# preset paints blue (directories, mode and tab pills, every popup border) changes.
# Named colours are ANSI slots, so kitty's palette swap recolours a running yazi;
# hex values are the theme's grounds. Directories match ls: bold, gold slot.

[mgr]
cwd          = { fg = "cyan" }
border_style = { fg = "#2a2a2a" }

[tabs]
active   = { fg = "#000000", bg = "yellow", bold = true }
inactive = { fg = "yellow", bg = "#1e1e1e" }

[mode]
normal_main = { fg = "#000000", bg = "yellow", bold = true }
normal_alt  = { fg = "yellow", bg = "#1e1e1e" }
select_main = { fg = "#000000", bg = "magenta", bold = true }
select_alt  = { fg = "magenta", bg = "#1e1e1e" }
unset_main  = { fg = "#000000", bg = "red", bold = true }
unset_alt   = { fg = "red", bg = "#1e1e1e" }

[status]
perm_sep   = { fg = "darkgray" }
perm_type  = { fg = "yellow" }
perm_read  = { fg = "green" }
perm_write = { fg = "red" }
perm_exec  = { fg = "cyan" }

[which]
border = { fg = "#2a2a2a" }
cand   = { fg = "cyan" }
desc   = { fg = "magenta" }

[confirm]
border = { fg = "#2a2a2a" }
title  = { fg = "yellow" }

[spot]
border  = { fg = "#2a2a2a" }
title   = { fg = "yellow" }
tbl_col = { fg = "yellow" }

[pick]
border = { fg = "#2a2a2a" }

[input]
border = { fg = "#2a2a2a" }

[cmp]
border = { fg = "#2a2a2a" }

[tasks]
border = { fg = "#2a2a2a" }

[help]
border = { fg = "#2a2a2a" }

# The same families as LS_COLORS in fish/colors.fish.
[filetype]
rules = [
	{ mime = "**/image/*", fg = "magenta" },
	{ mime = "**/{audio,video}/*", fg = "lightmagenta" },
	{ mime = "**/application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "red" },
	{ mime = "**/application/{pdf,doc,rtf}", fg = "lightyellow" },
	{ mime = "vfs/{absent,stale}", fg = "darkgray" },
	{ url = "*", is = "orphan", fg = "red", bold = true },
	{ url = "*", is = "link", fg = "cyan" },
	{ url = "*", is = "exec", fg = "green", bold = true },
	{ url = "*", is = "dummy", bg = "red" },
	{ url = "*/", is = "dummy", bg = "red" },
	{ url = "*/", fg = "yellow", bold = true },
]

[icon]
prepend_conds = [
	{ if = "dir", text = "󰉋", fg = "#f0d58c" },
	{ if = "exec & !link", text = "󰞷", fg = "#9ecf9a" },
]
