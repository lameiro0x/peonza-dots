# GENERATED by theme/render.py — theme «Grafito». Edit theme/templates/neofetch/config.conf or contracts/themes/grafito.json and re-run it.
# neofetch (7.1.0, AUR) in the theme: the peonza beside the same three groups as
# fastfetch, in the same hues. apps/fish/functions/neofetch.fish runs it with `--config`
# this file; neofetch sources it as bash, so it may also override neofetch's own
# functions (color, image_backend and dynamic_prompt, below).
#
# The peonza, in the theme's fg0 like every peonza (theme/fetch/fetch.py draws all three):
#   kitty     themes/<id>/neofetch/peonza.png over kitty's graphics protocol, shown 1:1:
#             drawn at the size of whole cells, never scaled
#   other     themes/<id>/neofetch/peonza.txt, in sextants
#   the TTY   the console's half-block peonza (its font has no sextants, no Nerd Font icons)
# Each is drawn after the text, centred on it in height behind a rule as tall as the
# text, and left out when the window is too narrow for it, the gap and the text.
# neofetch's own kitty backend is not used: it clears the screen, rescales the picture
# with ImageMagick and pins it to the top.

ryce_here=${RYCE_THEME_STATE:-$HOME/.local/state/ryce/theme}/current
ryce_tty=; [[ $TERM == linux ]] && ryce_tty=1
ryce_png=$ryce_here/neofetch/peonza.png
ryce_text_cols=52   # the widest line print_info writes (two screens with their rates)

# neofetch 7.1.0 only knows the 256-colour palette: a #rrggbb is sent as 24-bit colour.
color() {
    case $1 in
        "#"*)     printf '\e[38;2;%d;%d;%dm' "0x${1:1:2}" "0x${1:3:2}" "0x${1:5:2}" ;;
        [0-6])    printf '%b\e[3%sm' "$reset" "$1" ;;
        7 | "fg") printf '\e[37m%b' "$reset" ;;
        *)        printf '\e[38;5;%bm' "$1" ;;
    esac
}

# A group's title in its hue, and its keys in it after that.
ryce_group() {
    subtitle_color=$(color "$1")
    prin "$(color "$1")$2"
}

# A key with its icon, padded to one column with no-break spaces: neofetch squeezes
# runs of plain spaces to one. Counted in characters, whatever LC_ALL neofetch left set.
ryce_key() {
    local LC_ALL=C.UTF-8 icon=$1 key=$2 pad
    printf -v pad '%*s' $((11 - ${#key})) ''
    [[ $ryce_tty ]] && icon= || icon+=$'\xc2\xa0\xc2\xa0'
    printf '%s' "${icon}${key}${pad// /$'\xc2\xa0'}"
}

ryce_title() {
    local user=${USER:-$(id -un)} host=${HOSTNAME:-$(uname -n)}
    prin "$(color '#a8a8a8')${user}$(color '#848484')@$(color '#a8a8a8')${host}"
    length=$((${#user} + ${#host} + 1))
    info underline
}

ryce_uptime() {
    local s d
    read -r s _ < /proc/uptime
    s=${s%.*}
    d=$((s / 86400))
    printf '%s%d h %d min' "$( ((d)) && printf '%d d ' "$d")" $((s / 3600 % 24)) $((s / 60 % 60))
}

# Hyprland's outputs as fastfetch prints them; neofetch's own probe wants X (xrandr).
ryce_screens() {
    command -v hyprctl > /dev/null && command -v jq > /dev/null &&
        hyprctl -j monitors 2> /dev/null |
        jq -r 'map("\(.width)x\(.height) @ \(.refreshRate | round) Hz") | join(", ")' 2> /dev/null
}

# Hyprland's own version; neofetch 7.1.0 predates Hyprland and names no compositor.
ryce_compositor() {
    local v
    command -v hyprctl > /dev/null && v=$(hyprctl version 2> /dev/null | awk 'NR == 1 { print $1 " " $2 }')
    printf '%s' "${v:-${XDG_CURRENT_DESKTOP:-?}}"
}

# The graphics cards' marketing names, lspci's bracketed part («Intel Graphics», «GeForce
# RTX 4070»): neofetch's own cut leaves a stray «]» on Intel's «Arrow Lake-S [Intel Graphics]».
ryce_gpus() {
    command -v lspci > /dev/null || return
    lspci -mm 2> /dev/null | awk -F'"' '$2 ~ /^(VGA compatible|3D|Display) controller$/ {
        d = $6; if (match(d, /\[[^]]*\]/)) d = substr(d, RSTART + 1, RLENGTH - 2)
        out = out (out ? ", " : "") d } END { printf "%s", out }'
}

# «bar  used de total · n%», in fastfetch's units (GB counting 1024-based, one decimal).
# neofetch's own bar is empty for memory in GiB: it does integer arithmetic on «15.6».
ryce_usage() {
    local used=$1 total=$2 bar=
    ((total > 0)) || return
    printf '%s  %s' "$(bar "$((used >> 20))" "$((total >> 20))")" \
        "$(awk -v u="$used" -v t="$total" 'BEGIN { g = 2^30; printf "%.1f GB de %.1f GB · %d%%", u / g, t / g, 100 * u / t + 0.5 }')"
}

ryce_memory() {
    local total avail
    total=$(awk '/^MemTotal:/ { print $2 * 1024 }' /proc/meminfo)
    avail=$(awk '/^MemAvailable:/ { print $2 * 1024 }' /proc/meminfo)
    ryce_usage "$((total - avail))" "$total"
}

ryce_disk() {
    local size used
    read -r size used < <(df -B1 --output=size,used / 2> /dev/null | awk 'NR == 2')
    ryce_usage "${used:-0}" "${size:-0}"
}

# The eight ANSI colours as dots, like fastfetch's.
ryce_dots() {
    local i out=
    for i in 0 1 2 3 4 5 6 7; do out+="\e[3${i}m● "; done
    prin "${out}\e[0m"
}

print_info() {
    ryce_title

    ryce_group '#a8a8a8' equipo
    info "$(ryce_key '󰣇' sistema)" distro
    info "$(ryce_key '󰌽' núcleo)" kernel
    prin "$(ryce_key '󰔛' encendido)" "$(ryce_uptime)"
    info "$(ryce_key '󰏖' paquetes)" packages
    prin

    ryce_group '#a8a8a8' escritorio
    prin "$(ryce_key '󱂬' compositor)" "$(ryce_compositor)"
    prin "$(ryce_key '󰸌' tema)" "Grafito"
    info "$(ryce_key '󰞷' intérprete)" shell
    local screens
    screens=$(ryce_screens)
    if [[ $screens ]]; then
        prin "$(ryce_key '󰍹' pantallas)" "$screens"
    else
        info "$(ryce_key '󰍹' pantallas)" resolution
    fi
    prin

    ryce_group '#a8a8a8' máquina
    info "$(ryce_key '󰻠' procesador)" cpu
    local gpus
    gpus=$(ryce_gpus)
    if [[ $gpus ]]; then
        prin "$(ryce_key '󰢮' gráfica)" "$gpus"
    else
        info "$(ryce_key '󰢮' gráfica)" gpu
    fi
    prin "$(ryce_key '󰍛' memoria)" "$(ryce_memory)"
    prin "$(ryce_key '󰋊' disco)" "$(ryce_disk)"
    prin

    ryce_dots
}

# neofetch's own, for anything but the theme's peonza (--off, --source, --kitty ...).
# Guarded: neofetch sources a --config twice (the fish wrapper passes it, get_args reads it
# again), and a second rename would capture the override itself and recurse without end.
declare -F neofetch_image_backend >/dev/null \
    || eval "$(declare -f image_backend | sed '1s/^image_backend /neofetch_image_backend /')"
declare -F neofetch_dynamic_prompt >/dev/null \
    || eval "$(declare -f dynamic_prompt | sed '1s/^dynamic_prompt /neofetch_dynamic_prompt /')"

# kitty's cell in pixels (CSI 16t answers CSI 6;height;width t), into ryce_cw and ryce_ch.
ryce_cell() {
    local r
    printf '\e[16t'
    # shellcheck disable=SC2141   # the reply's fields end in ; and its last in t
    IFS=';t' read -d t -t 0.2 -sra r
    [[ ${r[1]} =~ ^[0-9]+$ && ${r[2]} =~ ^[0-9]+$ ]] && ((r[1] && r[2])) || return
    ryce_ch=${r[1]} ryce_cw=${r[2]}
}

# The PNG's size in pixels, from its header, into ryce_pw and ryce_ph.
ryce_png_size() {
    local b
    read -ra b < <(od -An -tu1 -w24 -N24 "$ryce_png" 2> /dev/null)
    [[ ${#b[@]} == 24 && ${b[1]}${b[2]}${b[3]} == 807871 ]] || return   # «PNG»
    ryce_pw=$((b[16] << 24 | b[17] << 16 | b[18] << 8 | b[19]))
    ryce_ph=$((b[20] << 24 | b[21] << 16 | b[22] << 8 | b[23]))
    ((ryce_pw && ryce_ph))
}

# Which peonza fits (ryce_art: png, text or empty) and the text's indent beside it. Its
# height is in pixels for the PNG and in lines for the text (ryce_ch 1), so ryce_place
# centres both with the same sums.
image_backend() {
    [[ $image_backend == ascii && $image_source == "$ryce_source" ]] || { neofetch_image_backend; return; }
    local cols line
    read -r _ cols < <(stty size 2> /dev/null)
    ryce_art=
    if [[ $TERM == xterm-kitty && -z $TMUX && -z $SSH_TTY && -t 0 && -t 1 ]] && ryce_png_size && ryce_cell &&
        ((cols >= (ryce_pw + ryce_cw - 1) / ryce_cw + gap + ryce_text_cols)); then
        ryce_art=png
        text_padding=$(((ryce_pw + ryce_cw - 1) / ryce_cw + gap))
    else
        # Counted in characters, whatever LC_ALL neofetch left set; the ink mark dropped.
        local LC_ALL=C.UTF-8
        mapfile -t ryce_rows < "$image_source"
        ryce_rows[0]=${ryce_rows[0]#\$\{c1\}} ryce_rows[0]=${ryce_rows[0]#\$1}
        ryce_ch=1 ryce_ph=${#ryce_rows[@]} text_padding=0
        for line in "${ryce_rows[@]}"; do ((${#line} > text_padding)) && text_padding=${#line}; done
        ((ryce_ph > 1 && cols >= text_padding + gap + ryce_text_cols)) && ryce_art=text
        ((text_padding += gap))
    fi
    [[ $ryce_art ]] || image_backend=off text_padding=
}

# Where the peonza goes beside $1 lines of text: its first line, `top` lines below the
# text's first, `dy` pixels into it; and how many lines the two take together, `total`.
ryce_place() {
    local px=$((($1 * ryce_ch - ryce_ph) / 2))
    ((px < 0)) && px=0
    top=$((px / ryce_ch)) dy=$((px % ryce_ch))
    total=$((top + (dy + ryce_ph + ryce_ch - 1) / ryce_ch))
    ((total < $1)) && total=$1
}

# After the text: a rule in the underline's colour beside each of its info_height lines,
# two cells before it, and the peonza centred on them; then the cursor below both.
dynamic_prompt() {
    [[ $ryce_art ]] || { neofetch_dynamic_prompt; return; }
    local rows top dy total i chunk
    read -r rows _ < <(stty size 2> /dev/null)
    ryce_place "$info_height"
    # Going back up beside the text needs all of it still on screen.
    ((info_height && total < rows)) || { printf '\n'; return; }
    for ((i = info_height; i < total; i++)); do printf '\n'; done
    printf '\r\e[%dA' "$total"
    for ((i = 0; i < info_height; i++)); do
        printf '\e[%dG%b│%b\n' $((text_padding - 2)) "$underline_color" "$reset"
    done
    printf '\e[%dA' $((info_height - top))
    if [[ $ryce_art == png ]]; then
        # Sent and shown at once (a=T) in 4096-byte chunks of base64, dy pixels into its
        # first cell, with the cursor left where it is (C=1) and no reply (q=2).
        mapfile -t chunk < <(base64 -w 4096 "$ryce_png")
        printf '\e_Ga=T,f=100,q=2,C=1,Y=%d,m=%d;%s\e\\' "$dy" $((${#chunk[@]} > 1)) "${chunk[0]}"
        for ((i = 1; i < ${#chunk[@]}; i++)); do
            printf '\e_Gm=%d;%s\e\\' $((i < ${#chunk[@]} - 1)) "${chunk[i]}"
        done
        printf '\e[%dB' $((total - top))
    else
        for i in "${ryce_rows[@]}"; do printf '%b%s%b\n' "$c1" "$i" "$reset"; done
        ((total > top + ryce_ph)) && printf '\e[%dB' $((total - top - ryce_ph))
    fi
    printf '\n'
}

if [[ $ryce_tty ]]; then
    ryce_source=$ryce_here/fastfetch/peonza.txt   # its ink mark is `$1`: fetch.py's TXT
    bar_char_elapsed="█"
    bar_char_total="░"
else
    ryce_source=$ryce_here/neofetch/peonza.txt
    bar_char_elapsed="━"
    bar_char_total="─"
fi
image_source=$ryce_source
image_backend="ascii"
ascii_colors=('#f2f2f2')
ascii_bold="off"
gap=5   # two cells, the rule, two cells

# title, @, underline, keys (each group sets its own), separator, values
colors=('#a8a8a8' '#848484' '#848484' '#a8a8a8' '#848484' '#f2f2f2')
bold="off"
underline_char="─"
separator=" "

os_arch="on"
distro_shorthand="off"
kernel_shorthand="on"
package_managers="on"
shell_path="off"
shell_version="on"
cpu_brand="on"
cpu_speed="off"
cpu_cores="off"
gpu_brand="on"
gpu_type="all"
bar_length=8
bar_border="off"
bar_color_elapsed='#f2f2f2'
bar_color_total='#848484'
