# GENERATED by theme/render.py — theme «Papel». Edit theme/templates/@papel/hypr/hyprlock.conf or contracts/themes/papel.json and re-run it.
# hyprlock 0.9.7 · Papel: the lock is a Wittgenstein Project book cover. The
# picture (theme/wallpaper/paper.py, lock) is the Tractatus as a block of dots
# with a window carved out of it; the time, a dash, the date and the field are
# set inside that window, left-aligned in Space Mono Bold like the cover's
# title, and the lockup (peonza + name) sits top left where the cover has its
# own. No blur and no dimming: dark ink on paper already clears 13:1.
#
# The window is paper.py WINDOW = cells 17..33 x 10..25 at 30 px: x 510..990,
# y 300..750 on 1920x1080; everything below starts 30 px inside it (x 540).
# Every colour and font is a theme token; the signal colour is used for exactly
# one line: how many AI sessions wait for you (agentd writes lock.txt).

general {
    # The cursor stays: the power and music buttons take clicks.
    hide_cursor = false
    ignore_empty_input = true
}

# A page settling: no overshoot, slower than the other themes.
animations {
    enabled = true
    bezier = page, 0.25, 0.1, 0.25, 1
    animation = fadeIn, 1, 5, page
    animation = fadeOut, 1, 4, page
    animation = inputFieldDots, 1, 3, page
    animation = inputFieldColors, 1, 4, page
}

background {
    monitor =
    path = ~/.local/state/ryce/theme/current/wallpaper/lock.jpg
    color = rgb(dbc6ae)
    blur_passes = 0
}


# --- the lockup, top left (the cover's «The Ludwig / Wittgenstein Project») ---

image {
    monitor =
    path = ~/.local/state/ryce/theme/current/peonza/logo.png
    size = 44
    rounding = 0
    border_size = 0
    position = 56, -40
    halign = left
    valign = top
}

label {
    monitor =
    text = <b>Ryce</b>
    color = rgb(413d38)
    font_size = 14
    font_family = Space Mono
    position = 112, -42
    halign = left
    valign = top
}

label {
    monitor =
    text = <b>Papel</b>
    color = rgb(413d38)
    font_size = 14
    font_family = Space Mono
    position = 112, -64
    halign = left
    valign = top
}


# --- the window: time, dash, date, the waiting line, the field ---------------

label {
    monitor =
    text = cmd[update:5000] printf '<b>%s</b>' "$(date '+%H:%M')"
    color = rgb(282623)
    font_size = 78
    font_family = Space Mono
    position = 540, -318
    halign = left
    valign = top
}

label {
    monitor =
    text = <b>—</b>
    color = rgb(282623)
    font_size = 26
    font_family = Space Mono
    position = 540, -446
    halign = left
    valign = top
}

# «viernes, 14 de noviembre», named here: without a generated es_ES locale
# `date` mixes English into it.
label {
    monitor =
    text = cmd[update:60000] date '+%u %-d %-m' | awk '{ split("lunes martes miércoles jueves viernes sábado domingo", d, " "); split("enero febrero marzo abril mayo junio julio agosto septiembre octubre noviembre diciembre", m, " "); print "<b>" d[$1] ", " $2 " de " m[$3] "</b>" }'
    color = rgb(282623)
    font_size = 19
    font_family = Space Mono
    position = 540, -496
    halign = left
    valign = top
}

# "N agentes te esperan", or nothing (never a project name: a locked screen is
# read by passers-by).
label {
    monitor =
    text = cmd[update:2000] cat "$XDG_RUNTIME_DIR/agentd/lock.txt" 2>/dev/null
    color = rgb(a3311c)
    font_size = 12
    font_family = Space Mono
    position = 540, -540
    halign = left
    valign = top
}

input-field {
    monitor =
    size = 360, 38
    outline_thickness = 1
    rounding = 2
    outer_color = rgb(282623)
    inner_color = rgb(dbc6ae)
    font_color = rgb(282623)
    font_family = Space Mono
    placeholder_text = <span foreground="##413d38">contraseña · $LAYOUT[US,ES]</span>
    check_color = rgb(282623)
    fail_color = rgb(842543)
    capslock_color = rgb(684100)
    fail_text = <span foreground="##842543">$FAIL ($ATTEMPTS)</span>
    dots_size = 0.24
    dots_spacing = 0.4
    dots_rounding = -1
    dots_center = false
    fade_on_empty = false
    position = 540, -608
    halign = left
    valign = top
}

# Music: one line under the field, in grey.
label {
    monitor =
    # Escaped for Pango: any web page can set a track title (security review 2026-11-09).
    text = cmd[update:2000] t=$(playerctl metadata title 2>/dev/null) && printf '%s — %s\n' "$t" "$(playerctl metadata artist 2>/dev/null)" | awk '{ print substr($0, 1, 44) }' | sed 's/\&/\&amp;/g; s/</\&lt;/g; s/>/\&gt;/g'
    color = rgb(413d38)
    font_size = 10
    font_family = Space Mono
    position = 540, -668
    halign = left
    valign = top
}


# --- the foot: the machine on the left, two plain words on the right -------
# Sleep is hibernate: S3 suspend kills this board's chipset on wake
# (install/power-setup.sh).

label {
    monitor =
    text = cmd[update:60000] awk -v host="$(cat /etc/hostname 2>/dev/null)" '{ s = int($1); d = int(s / 86400); h = int(s % 86400 / 3600); m = int(s % 3600 / 60); t = (d ? d " d " : "") ((d || h) ? h " h " : "") m " min"; print host " · encendido " t }' /proc/uptime
    color = rgb(413d38)
    font_size = 10
    font_family = Space Mono
    position = 60, 36
    halign = left
    valign = bottom
}

label {
    monitor =
    text = <b>Hibernar</b>
    onclick = systemctl hibernate
    color = rgb(282623)
    font_size = 11
    font_family = Space Mono
    position = -170, 36
    halign = right
    valign = bottom
}

label {
    monitor =
    text = <b>Apagar</b>
    onclick = systemctl poweroff
    color = rgb(282623)
    font_size = 11
    font_family = Space Mono
    position = -60, 36
    halign = right
    valign = bottom
}
