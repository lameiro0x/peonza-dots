# GENERATED by theme/fetch/fetch.py — theme «Papel». Edit theme/fetch/dripfetch.yaml or contracts/themes/papel.json and re-run it.
# dripfetch 0.5 (github a-shygun/dripfetch): rain over boxes. theme/fetch/fetch.py
# resolves theme/render.py's placeholders and draws the half-block peonza in place of
# the `@@peonza@@` line. apps/fish/functions/dripfetch.fish runs a copy of the rendered
# file, because dripfetch writes a moved box's position back into the file it runs.
#
# Its own labels (SYSTEM, Uptime, ...) are hard-coded English; only titles and text
# are ours. No weather box (it guesses the location from the public IP) and no
# calendar (month names in English).

# Transparent (#rrggbb00 paints the terminal's default background): kitty's
# translucency stays.
background: "#dbc6ae00"

rain:
  collision: true
  # Drops on screen; the rain is dripfetch's whole CPU cost.
  intensity: 45
  character: ["│", "╎", "┆"]
  colors:
    - [0.50, "#534e49"]
    - [0.30, "#413d38"]
    - [0.20, "#413d38"]
  speeds:
    - [0.25, 30]
    - [0.25, 45]
    - [0.25, 60]
    - [0.25, 80]
  lengths:
    - [0.60, 4]
    - [0.30, 10]
    - [0.10, 18]
  effects: {acceleration: true, splash: false}

boxes:
  border: titled_single
  border_color: "#534e49"
  text_color: "#282623"
  accent_color: "#413d38"
  padding: {horizontal: 2, vertical: 0}
  items:
    # The peonza: one ink, its grooves left in the ground colour.
    - type: text
      border: none
      alignment: left
      text:
        - "                   █▀█"
        - "                  ▄ ██"
        - "                  ▀▄██"
        - "                ▄█ ███"
        - "               ▄█ █████"
        - "             ▄██ ██████"
        - "          ▄▄██▀ ████████"
        - "▄████████████▀▄██████████▄"
        - "██████████▀▀▄███████████████▄▄▄"
        - "▀▀█████▀ ▄███████████████████████▄"
        - "    ▀▀▀ ▄▄ ▀▀▀█████████████████████"
        - "         ▀█▄ ███▄▄▄▄▄▄▄█████████▀▀"
        - "           ▀▄▀████████▀"
        - "            ▀  ███▀▀"
        - "               ▀"
      position: {horizontal: -34, vertical: -3}

    - type: text
      title: ryce
      alignment: center
      text: ["Papel", "q salir · espacio pausa"]
      position: {horizontal: -34, vertical: 9}

    - type: clock
      clock_size: medium
      clock_style: single
      clock_24h: true
      show_seconds: false
      blink_colon: true
      show_date: false
      position: {horizontal: 22, vertical: -12}

    - type: sysinfo
      title: sistema
      sections: {system: true, display: true, hardware: true, disk: true, connectivity: false}
      position: {horizontal: 22, vertical: 5}
