# GENERATED by theme/render.py — theme «Papel». Edit theme/templates/kitty/kitty.conf or contracts/themes/papel.json and re-run it.
# kitty 0.49.2, theme «Papel». The ground is the theme's bg1, the letters
# its 16 ANSI colours and the term block (cursor, selection, links); never the
# signal colour, which belongs to "an AI session waits for you", drawn by the frame.
# ~/.config/kitty/kitty.conf resolves through the theme state; bin/ryce-theme
# swaps it and sends SIGUSR1, which makes every kitty re-read this file.

# Font. Terminals keep JetBrainsMono Nerd Font in every theme, for legibility.
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        13.0
modify_font      cell_height 112%

# The peonza (U+100000-U+100002 by size; U+100003 the prompt's cut) lives in its
# own font. kitty gives a symbol as many cells as its ink is wide, one per space
# that follows it: the prompt's cut is wider than two cells and written "<mark>  ",
# and narrow_symbols pins it to three, so it is never shrunk nor cut
# (theme/peonza/glyph.py).
symbol_map     U+100000-U+100003 Ryce Peonza
narrow_symbols U+100003 3

# Padding
window_padding_width 16 22

# No decorations: Hyprland tiles and the bar names the window. The tab bar only
# appears once a second tab exists, as quiet text on the terminal's own ground.
hide_window_decorations yes
tab_bar_edge            bottom
tab_bar_min_tabs        2
tab_bar_style           separator
tab_separator           "  "
tab_title_template      "{index} {title}"
tab_bar_margin_width    6.0
tab_bar_margin_height   6.0 0.0
tab_bar_background      none
active_tab_foreground   #282623
active_tab_background   #c2ad96
active_tab_font_style   normal
inactive_tab_foreground #413d38
inactive_tab_background #d4bfa8
inactive_tab_font_style normal

# Splits
active_border_color   #534e49
inactive_border_color #aa9885
bell_border_color     #413d38

# Translucent so Hyprland's blur shows through. kitty 0.43 made opacity linear;
# theme/tests/test_terminal.py composites bg1 at this alpha over the brightest
# pixel of the theme's worst wallpaper after the blur, and keeps fg0, fg1, fg2
# and every ANSI colour >= 4.5:1 there.
background_opacity         1.0
dynamic_background_opacity yes
# Faint text (SGR 2: Claude Code's hints, git's and fish's dim output) is the
# foreground at this opacity; kitty's 0.4 left it near 2:1 on Papel. 0.75 keeps
# faint fg0 >= 4.5:1 on every theme's ground, glass included.
dim_opacity                0.75

# Colours
background           #d4bfa8
foreground           #282623
selection_background #c3bd92
selection_foreground #282623
url_color            #174b7e
url_style            curly

color0  #282623
color1  #8b2c49
color2  #235a28
color3  #6e4700
color4  #215085
color5  #733970
color6  #00585c
color7  #514e4a
color8  #514e4b
color9  #7e2a3c
color10 #225a27
color11 #6f460b
color12 #1d4d87
color13 #70306c
color14 #00585d
color15 #171614

# Cursor
cursor            #282623
cursor_text_color #d4bfa8
cursor_shape      block

cursor_blink_interval      0.6
cursor_stop_blinking_after 15.0

# Cursor trail
cursor_trail                 50
cursor_trail_decay           0.2 0.7
cursor_trail_start_threshold 1
cursor_trail_color           #282623

# Scrollback
scrollback_lines 10000

# Shell integration (prompt marks, cwd for new windows; agentd reads the tree)
shell_integration enabled

# Mouse
mouse_hide_wait 2.0

# No bell
enable_audio_bell no

# Clear screen
map super+l send_text all \x0c

# One OS window per kitty process. agentd maps a Claude session to its Hyprland
# window through the process tree, so a second OS window inside this process
# (kitty's default kitty_mod+n) would share one pid and blur which window is
# waiting. kitty_mod+n opens an independent terminal instead (ryce-term: its own
# process in its own scope), in this window's directory. Splits and tabs stay in
# the same Hyprland window, which is fine.
map kitty_mod+n launch --type=background --cwd=current sh -c 't="$HOME/.local/bin/ryce-term"; [ -x "$t" ] || t=kitty; exec "$t"'

# kitty 0.50 adds the Program Status Protocol (OSC 7501): a program reports
# working / blocked / done per window and kitty exposes it as {tab.program_status}
# in tab_title_template (Claude Code is reported to emit it). Left off on purpose:
# 0.49.2, the version in [extra], does not know the field, and agentd already
# shows the same state in the bar from the session files. Once kitty >= 0.50 is
# in [extra]: tab_title_template "{tab.program_status} {index} {title}"
