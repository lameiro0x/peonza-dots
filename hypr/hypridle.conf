# hypridle · lock at 10 min, screen off at 15 min, never suspend (a desktop
# that runs AI sessions overnight). Started by ryce-session.target.
# Neither happens while a Claude Code session works: agentd holds a logind idle
# inhibitor then (agentd/agentd/awake.py; `systemd-inhibit --list` shows it).
# The timers start again when the work stops. ignore_systemd_inhibit stays false.
# Hyprland 0.57 dispatches Lua: dpms is hl.dsp.dpms({ action = ... }).

general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}

listener {
    timeout = 600
    on-timeout = loginctl lock-session
}

listener {
    timeout = 900
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}
