# cava for the left-edge visualiser (EdgeViz.qml): ASCII frames on stdout.
# `bars` must match EdgeViz.qml; a level of N draws N dots (ascii_max_range = the
# longest bar). Started only while the edge is shown and a player plays.
[general]
bars = 72
framerate = 30
autosens = 1
# Seconds of silence before cava stops emitting frames (no repaint while quiet).
sleep_timer = 2

[input]
method = pipewire
source = auto

[output]
method = raw
raw_target = /dev/stdout
data_format = ascii
ascii_max_range = 72
bar_delimiter = 59
frame_delimiter = 10
channels = mono

[smoothing]
noise_reduction = 77
