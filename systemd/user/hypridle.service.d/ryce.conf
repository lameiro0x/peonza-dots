# Drop-in on the packaged unit (/usr/lib/systemd/user/hypridle.service), which hangs
# off graphical-session.target, a target greetd never activates. ryce-session.target
# Wants= it, and PartOf= makes `systemctl --user stop ryce-session.target` (on
# Hyprland shutdown) stop it too. The packaged unit has no Requisite=, so a
# drop-in is enough; cliphist and waybar have one and are shadowed whole instead.
[Unit]
PartOf=ryce-session.target
