; qt6ct colour scheme. Role order (QPalette::ColorRole): WindowText, Button, Light,
; Midlight, Dark, Mid, Text, BrightText, ButtonText, Base, Window, Shadow, Highlight,
; HighlightedText, Link, LinkVisited, AlternateBase, NoRole, ToolTipBase, ToolTipText,
; PlaceholderText, Accent. Like GTK: selection is quiet (bg3 under fg0) and Accent is
; the pill (checked boxes, progress, the default button).
