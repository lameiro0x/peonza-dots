active_colors={{fg0}}, {{bg2}}, {{line}}, {{bg3}}, {{bg0}}, {{bg1}}, {{fg0}}, {{pill}}, {{fg0}}, {{bg0}}, {{bg1}}, {{bg0}}, {{bg3}}, {{fg0}}, {{fg1}}, {{fg1}}, {{bg1}}, {{bg1}}, {{bg2}}, {{fg0}}, {{fg1}}, {{pill}}
inactive_colors={{fg0}}, {{bg2}}, {{line}}, {{bg3}}, {{bg0}}, {{bg1}}, {{fg0}}, {{pill}}, {{fg0}}, {{bg0}}, {{bg1}}, {{bg0}}, {{bg2}}, {{fg0}}, {{fg1}}, {{fg1}}, {{bg1}}, {{bg1}}, {{bg2}}, {{fg0}}, {{fg1}}, {{fg1}}
disabled_colors={{fg2}}, {{bg2}}, {{line}}, {{bg3}}, {{bg0}}, {{bg1}}, {{fg2}}, {{fg2}}, {{fg2}}, {{bg1}}, {{bg1}}, {{bg0}}, {{bg2}}, {{fg2}}, {{fg2}}, {{fg2}}, {{bg1}}, {{bg1}}, {{bg2}}, {{fg2}}, {{fg2}}, {{bg3}}
