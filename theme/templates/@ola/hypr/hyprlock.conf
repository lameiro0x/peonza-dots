# hyprlock 0.9.7 · Ola: the shared lock (theme/templates/hypr/hyprlock.conf)
# with its column moved to the right, onto Red Fuji. Behind the shared corner
# the print's mist is pale teal, and no darkening that keeps Hokusai a print
# lets cream text clear 4.5:1 there; the mountain's vermilion does (measured
# on the stage's captures). The login page repeats this composition.
#
# Every colour, font and radius is a theme token; the theme's signal colour is
# used for exactly one line: how many AI sessions wait for you (agentd writes
# the count to lock.txt). Checked against hyprlock 0.9.7 itself.

general {
    # The cursor stays: the power and music buttons below take clicks.
    hide_cursor = false
    ignore_empty_input = true
}

# Fade in and out on a decelerating curve; the field's dots and colours ease
# too. The same timing in every theme: hyprlock cannot read the theme's curves.
animations {
    enabled = true
    bezier = decel, 0.05, 0.7, 0.1, 1
    animation = fadeIn, 1, 4, decel
    animation = fadeOut, 1, 3, decel
    animation = inputFieldDots, 1, 2, decel
    animation = inputFieldColors, 1, 3, decel
}

# The theme's lock art, never a screenshot (prettier, and it shows nothing of
# what was open): softened, not erased, and darkened until every line of text
# clears 4.5:1 on the brightest art behind it (measured on the stage's
# captures; a full-screen shape cannot do it: hyprlock draws shapes over the
# labels of the same zindex, and under the background below it). The flat
# colour shows if the file is missing.
background {
    monitor =
    path = ~/.local/state/ryce/theme/current/wallpaper/lock.jpg
    color = rgb({{bg0.hex}})
    blur_passes = 2
    blur_size = 6
    brightness = 0.62
    contrast = 0.95
    vibrancy = 0.1
    noise = 0.012
}


# Composition: one right-aligned column 88 px in, on the mountain: the peonza
# (in the sky above it), the greeting, the clock, the date, the waiting line,
# the music and the power buttons; the field centred low, one system line in
# the top-right corner. Offsets count up from the bottom edge.

# The peonza at 128 px: an exact half of the 256 px cut-out, so its edge stays
# clean; no rounding, border or shadow, so nothing draws a box around it.
image {
    monitor =
    path = ~/.local/state/ryce/theme/current/peonza/logo.png
    size = 128
    rounding = 0
    border_size = 0
    zindex = 1
    position = -84, 568
    halign = right
    valign = bottom
}

# «Buenos días» until two (Spanish lunch), «buenas tardes» until nine.
label {
    monitor =
    text = cmd[update:60000] h=$(date +%-H); if [ "$h" -ge 6 ] && [ "$h" -lt 14 ]; then g='Buenos días'; elif [ "$h" -ge 14 ] && [ "$h" -lt 21 ]; then g='Buenas tardes'; else g='Buenas noches'; fi; printf '%s, %s' "$g" "$USER"
    color = rgb({{fg0.hex}})
    font_size = 17
    font_family = {{font.ui}}
    text_align = right
    position = -92, 532
    halign = right
    valign = bottom
}

# font_size is in points at 96 dpi: 104 pt = 139 px, far over Grafito's 26 px
# floor for its dot-matrix face.
label {
    monitor =
    text = cmd[update:5000] date '+%H{{clock.sep}}%M'
    color = rgb({{fg0.hex}})
    font_size = 104
    font_family = {{font.display}}
    text_align = right
    position = -86, 322
    halign = right
    valign = bottom
}

# Spanish like the sidebar («lunes, 9 de noviembre»), named here rather than by
# LC_TIME: without a generated es_ES locale `date` mixes English into it
# («Monday, 9 de November», seen on the stage).
label {
    monitor =
    text = cmd[update:60000] date '+%u %-d %-m' | awk '{ split("lunes martes miércoles jueves viernes sábado domingo", d, " "); split("enero febrero marzo abril mayo junio julio agosto septiembre octubre noviembre diciembre", m, " "); print d[$1] ", " $2 " de " m[$3] }'
    color = rgb({{fg1.hex}})
    font_size = 15
    font_family = {{font.ui}}
    text_align = right
    position = -92, 290
    halign = right
    valign = bottom
}

# "N agentes te esperan", or nothing: agentd keeps lock.txt to a count (never a
# project name: a locked screen is read by passers-by) and empty when no AI
# session waits; the label stays empty when agentd is not running at all.
# Bold at 14 pt (18.7 px): large text for WCAG, so 3:1 is its floor; the seal
# pink on the vermilion measures 3.9:1.
label {
    monitor =
    text = cmd[update:2000] t=$(cat "$XDG_RUNTIME_DIR/agentd/lock.txt" 2>/dev/null); [ -z "$t" ] || printf '<b>%s</b>' "$t"
    color = rgb({{signal.hex}})
    font_size = 14
    font_family = {{font.ui}}
    text_align = right
    position = -92, 262
    halign = right
    valign = bottom
}

# dots_rounding -2 follows the field's own radius: near-square dots in every theme,
# as the corners are. The placeholder names the keyboard: the password was
# typed with the US map, and Alt+Shift switches to ES.
input-field {
    monitor =
    size = 300, 48
    outline_thickness = {{geometry.border}}
    rounding = {{geometry.rounding}}
    outer_color = rgba({{fg1.rgb}}, 0.35)
    inner_color = rgba({{bg0.rgb}}, 0.72)
    font_color = rgb({{fg0.hex}})
    font_family = {{font.ui}}
    placeholder_text = <span foreground="##{{fg1.hex}}">contraseña · $LAYOUT[US,ES]</span>
    check_color = rgb({{fg1.hex}})
    fail_color = rgb({{err.hex}})
    capslock_color = rgb({{warn.hex}})
    fail_text = <span foreground="##{{err.hex}}">$FAIL ($ATTEMPTS)</span>
    dots_size = 0.2
    dots_spacing = 0.35
    dots_rounding = -2
    fade_on_empty = false
    position = 0, 88
    halign = center
    valign = bottom
}

# Music: title over artist, right-aligned, with a play/pause button; all three
# empty when no player is running.
label {
    monitor =
    # Escaped for Pango: any web page can set a track title (security review 2026-11-09).
    text = cmd[update:2000] playerctl metadata title 2>/dev/null | awk '{ print substr($0, 1, 40) }' | sed 's/\&/\&amp;/g; s/</\&lt;/g; s/>/\&gt;/g'
    color = rgb({{fg0.hex}})
    font_size = 13
    font_family = {{font.ui}}
    text_align = right
    position = -140, 218
    halign = right
    valign = bottom
}

label {
    monitor =
    text = cmd[update:2000] playerctl metadata artist 2>/dev/null | awk '{ print substr($0, 1, 40) }' | sed 's/\&/\&amp;/g; s/</\&lt;/g; s/>/\&gt;/g'
    color = rgb({{fg1.hex}})
    font_size = 11
    font_family = {{font.ui}}
    text_align = right
    position = -140, 196
    halign = right
    valign = bottom
}

label {
    monitor =
    text = cmd[update:1000] case $(playerctl status 2>/dev/null) in Playing) printf '{{glyph.uF03E6}}' ;; Paused) printf '{{glyph.uF040D}}' ;; esac
    onclick = playerctl play-pause
    color = rgb({{fg0.hex}})
    font_size = 24
    font_family = {{font.icon}} Propo
    zindex = 1
    position = -88, 196
    halign = right
    valign = bottom
}

# Glyphs come from the Propo cut of the icon font: the monospaced one gives
# each glyph one cell, and hyprlock clips what overflows it.
# Power: a glyph in a square-cornered frame over a word, both clickable. Hibernate (S3 suspend kills
# this board's chipset on wake: install/power-setup.sh), then power off (logind
# lets the active session do both without a password).
label {
    monitor =
    text = {{glyph.uF0904}}
    onclick = systemctl hibernate
    color = rgb({{fg0.hex}})
    font_size = 20
    font_family = {{font.icon}} Propo
    zindex = 1
    position = -231, 127
    halign = right
    valign = bottom
}

shape {
    monitor =
    size = 48, 48
    rounding = {{geometry.pill_radius}}
    color = rgba({{bg0.rgb}}, 0.35)
    border_size = 1
    border_color = rgba({{fg1.rgb}}, 0.6)
    onclick = systemctl hibernate
    position = -219, 116
    halign = right
    valign = bottom
}

label {
    monitor =
    text = Hibernar
    onclick = systemctl hibernate
    color = rgb({{fg1.hex}})
    font_size = 10
    font_family = {{font.ui}}
    position = -204, 88
    halign = right
    valign = bottom
}

label {
    monitor =
    text = {{glyph.uF0425}}
    onclick = systemctl poweroff
    color = rgb({{fg0.hex}})
    font_size = 20
    font_family = {{font.icon}} Propo
    zindex = 1
    position = -100, 127
    halign = right
    valign = bottom
}

shape {
    monitor =
    size = 48, 48
    rounding = {{geometry.pill_radius}}
    color = rgba({{bg0.rgb}}, 0.35)
    border_size = 1
    border_color = rgba({{fg1.rgb}}, 0.6)
    onclick = systemctl poweroff
    position = -88, 116
    halign = right
    valign = bottom
}

label {
    monitor =
    text = Apagar
    onclick = systemctl poweroff
    color = rgb({{fg1.hex}})
    font_size = 10
    font_family = {{font.ui}}
    position = -90, 88
    halign = right
    valign = bottom
}

# One system line, top right, in fg0: the sky behind it is mid blue.
label {
    monitor =
    text = cmd[update:60000] awk -v host="$(cat /etc/hostname 2>/dev/null)" '{ s = int($1); d = int(s / 86400); h = int(s % 86400 / 3600); m = int(s % 3600 / 60); t = (d ? d " d " : "") ((d || h) ? h " h " : "") m " min"; print host " · encendido " t }' /proc/uptime
    color = rgb({{fg0.hex}})
    font_size = 11
    font_family = {{font.ui}}
    text_align = right
    position = -88, -64
    halign = right
    valign = top
}
