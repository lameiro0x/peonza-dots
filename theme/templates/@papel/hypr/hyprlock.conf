# hyprlock 0.9.7 · Papel: the lock is a book's title page in the reading room.
# The picture (theme/wallpaper/paper.py, lock) is green baize under a lamp with a
# gilt double rule round the screen, a fleuron breaking it at the head, a short
# rule under the title, the peonza as the printer's device and a hairline for the
# password. Here the title is the hour written in words (bin/ryce-hora, the desk
# clock's own rule) in EB Garamond Italic with one gilt swash capital, and under
# it the part of the day and the date in Literata Italic with old-style figures
# (<i> in the markup: a style in font_family is taken as part of the name).
# No blur and no dimming: vellum on baize already clears 12:1.
#
# Rows are paper.py LOCK_ROWS on 1920x1080, every label centred on the screen's
# axis and placed by its centre (valign = center: y counts up from y 540): the
# title rule at y 548, the device 590..672, the field's hairline at y 778.
# Every colour and font is a theme token; the signal colour is used for exactly
# one line: how many AI sessions wait for you (agentd writes lock.txt).

general {
    # The cursor stays: the power buttons take clicks.
    hide_cursor = false
    ignore_empty_input = true
}

# A page settling: no overshoot, slower than the other themes.
animations {
    enabled = true
    bezier = page, 0.25, 0.1, 0.25, 1
    animation = fadeIn, 1, 5, page
    animation = fadeOut, 1, 4, page
    animation = inputFieldDots, 1, 3, page
    animation = inputFieldColors, 1, 4, page
}

background {
    monitor =
    path = ~/.local/state/ryce/theme/current/wallpaper/lock.jpg
    color = rgb({{bg0.hex}})
    blur_passes = 0
}


# --- the title: the hour in words, then the part of the day and the date -----

# «Las diez y cuarto», centred on y 400. Without ryce-hora (not deployed yet) it
# falls back to the digits rather than leave the page blank.
label {
    monitor =
    text = cmd[update:5000] h="$HOME/.local/bin/ryce-hora"; { [ -x "$h" ] && "$h" --pango --color '##{{tint.hex}}' || date '+%H{{clock.sep}}%M'; } | sed 's/.*/<i>&<\/i>/'
    color = rgb({{fg0.hex}})
    font_size = 80
    font_family = {{font.display}}
    position = 0, 140
    halign = center
    valign = center
}

# «de la noche · jueves, diecinueve de noviembre · 22:15», centred on y 492: the
# date written as the desk writes it (ryce-hora --fecha), the digits kept because
# the lock has no bar. Without ryce-hora the weekday and month are named here
# (without a generated es_ES locale `date` mixes English into them) and the day
# stays in figures. At midnight and noon the hour's name says the part.
label {
    monitor =
    text = cmd[update:5000] h="$HOME/.local/bin/ryce-hora"; if [ -x "$h" ]; then p=$("$h" --parte); f=$("$h" --fecha); fi; date '+%u %-d %-m %H:%M' | awk -v p="$p" -v f="$f" '{ split("lunes martes miércoles jueves viernes sábado domingo", d, " "); split("enero febrero marzo abril mayo junio julio agosto septiembre octubre noviembre diciembre", m, " "); if (f == "") f = d[$1] ", " $2 " de " m[$3]; printf "<i><span font_features=\"onum\">%s%s · %s</span></i>\n", (p == "" ? "" : p " · "), f, $4 }'
    color = rgb({{fg1.hex}})
    font_size = 15
    font_family = {{font.ui}}
    position = 0, 48
    halign = center
    valign = center
}


# --- the field, on the picture's hairline (y 778) -----------------------------
# Its box is invisible: the hairline is the field. It lights gilt while the
# password is checked and in the error colour when it fails.
input-field {
    monitor =
    size = 360, 40
    outline_thickness = 1
    rounding = 0
    outer_color = rgba({{bg0.rgb}}, 0)
    inner_color = rgba({{bg0.rgb}}, 0)
    font_color = rgb({{fg0.hex}})
    font_family = {{font.ui}}
    placeholder_text = <i><span foreground="##{{fg2.hex}}">contraseña · $LAYOUT[US,ES]</span></i>
    check_color = rgb({{tint.hex}})
    fail_color = rgb({{err.hex}})
    capslock_color = rgb({{warn.hex}})
    fail_text = <i><span foreground="##{{err.hex}}">$FAIL ($ATTEMPTS)</span></i>
    dots_size = 0.22
    dots_spacing = 0.45
    dots_rounding = -1
    dots_center = true
    fade_on_empty = false
    position = 0, -217
    halign = center
    valign = center
}

# "N agentes te esperan", or nothing (never a project name: a locked screen is
# read by passers-by), centred on y 816 under the hairline.
label {
    monitor =
    text = cmd[update:2000] t=$(cat "$XDG_RUNTIME_DIR/agentd/lock.txt" 2>/dev/null) && [ -n "$t" ] && printf '<i>%s</i>\n' "$t"
    color = rgb({{signal.hex}})
    font_size = 13
    font_family = {{font.ui}}
    position = 0, -276
    halign = center
    valign = center
}

# Music: one quiet line under it, title · artist (y 852).
label {
    monitor =
    # Escaped for Pango: any web page can set a track title (security review 2026-11-09).
    text = cmd[update:2000] t=$(playerctl metadata title 2>/dev/null) && printf '%s · %s\n' "$t" "$(playerctl metadata artist 2>/dev/null)" | awk '{ print substr($0, 1, 60) }' | sed 's/\&/\&amp;/g; s/</\&lt;/g; s/>/\&gt;/g; s/.*/<i>&<\/i>/'
    color = rgb({{fg2.hex}})
    font_size = 11
    font_family = {{font.ui}}
    position = 0, -312
    halign = center
    valign = center
}


# --- the foot, inside the frame (inner rule at y 1022) ------------------------
# The imprint on the left; two words in small capitals on the right.
# Sleep is hibernate: S3 suspend kills this board's chipset on wake
# (install/power-setup.sh).

label {
    monitor =
    text = cmd[update:60000] awk -v host="$(cat /etc/hostname 2>/dev/null)" '{ s = int($1); d = int(s / 86400); h = int(s % 86400 / 3600); m = int(s % 3600 / 60); t = (d ? d " d " : "") ((d || h) ? h " h " : "") m " min"; printf "<i><span font_features=\"onum\">%s · encendido %s</span></i>\n", host, t }' /proc/uptime
    color = rgb({{fg2.hex}})
    font_size = 10
    font_family = {{font.ui}}
    position = 96, 80
    halign = left
    valign = bottom
}

label {
    monitor =
    text = <span font_features="smcp" letter_spacing="1200">hibernar</span>
    onclick = systemctl hibernate
    color = rgb({{fg1.hex}})
    font_size = 11
    font_family = {{font.ui}}
    position = -210, 80
    halign = right
    valign = bottom
}

label {
    monitor =
    text = <span font_features="smcp" letter_spacing="1200">apagar</span>
    onclick = systemctl poweroff
    color = rgb({{fg1.hex}})
    font_size = 11
    font_family = {{font.ui}}
    position = -96, 80
    halign = right
    valign = bottom
}
