<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Generic families: work in JetBrainsMono Nerd Font, UI in Inter, colour
     emoji only as the last fallback. The themes name their own type (Martian
     Mono, Space Grotesk, Doto, Inter Display) from ~/.local/share/fonts/ryce;
     a family without a generic falls back through sans-serif (Martian Mono
     through monospace), and none of them carries the nf-md icons, so
     JetBrainsMono Nerd Font sits early in both lists: no other Nerd Font
     installed gets to draw the icons. The peonza (U+100000-U+100002) exists
     only in "Ryce Peonza", so any fallback finds it; kitty maps it by name. -->
<fontconfig>
  <alias binding="same">
    <family>monospace</family>
    <prefer>
      <family>JetBrainsMono Nerd Font</family>
      <family>Noto Sans Mono</family>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>
  <alias binding="same">
    <family>sans-serif</family>
    <prefer>
      <family>Inter</family>
      <family>Noto Sans</family>
      <family>JetBrainsMono Nerd Font</family>
      <family>Noto Sans CJK JP</family>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>
  <alias binding="same">
    <family>serif</family>
    <prefer>
      <family>Noto Serif</family>
      <family>Noto Serif CJK JP</family>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>
  <alias binding="same">
    <family>emoji</family>
    <prefer>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>
</fontconfig>
