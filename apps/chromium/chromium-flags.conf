# Read by Arch's /usr/bin/chromium launcher from ~/.config/chromium-flags.conf: split on
# whitespace with shell quoting, lines starting with # skipped, nothing expanded (no ~,
# no $HOME), so the paths must be absolute. install/deploy.sh writes this file there as a
# real file (links.tsv `render`) with your home folder in place of each @HOME@: edit it
# here and run deploy.sh again. The value is in single quotes so a home with a space stays
# one flag.
#
# The rice's two unpacked extensions, refreshed by ryce-chromium-theme on every theme
# switch: the window's colours and the new tab page. Chromium ignores --load-extension
# while Enhanced Safe Browsing is on (Settings > Privacy > Security: keep «Standard»).
--load-extension='@HOME@/.local/share/ryce/chromium/theme,@HOME@/.local/share/ryce/chromium/newtab'
# Chromium 156 puts a strip under an extension's new tab (its name and «Personalizar
# Chromium»); the page already says whose it is. Customizing stays in the ⋮ menu.
--disable-features=NtpFooter
